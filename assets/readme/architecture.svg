<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Gateway architecture</title>
  <desc id="desc">API surfaces feed a response orchestrator that drives Headless or ACP backends against Grok Build CLI, with a SQLite journal for durable events and keys.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#111922"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="26" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="438" rx="25" fill="none" stroke="#243041"/>

  <text x="48" y="48" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">HOW IT WORKS</text>
  <text x="48" y="90" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700">One orchestrator · dual backends · durable journal</text>

  <!-- API layer -->
  <g transform="translate(48 120)">
    <rect width="1104" height="84" rx="16" fill="#0F1620" stroke="#2A3A4F"/>
    <text x="24" y="30" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">API SURFACES</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <rect x="24" y="42" width="210" height="30" rx="8" fill="#152238"/>
      <text x="34" y="62" fill="#E8EEF5">/v1/chat/completions</text>
      <rect x="246" y="42" width="160" height="30" rx="8" fill="#152238"/>
      <text x="256" y="62" fill="#E8EEF5">/v1/responses</text>
      <rect x="418" y="42" width="180" height="30" rx="8" fill="#152238"/>
      <text x="428" y="62" fill="#E8EEF5">/v1/permissions</text>
      <rect x="610" y="42" width="100" height="30" rx="8" fill="#152238"/>
      <text x="620" y="62" fill="#E8EEF5">/v1/keys</text>
      <rect x="722" y="42" width="120" height="30" rx="8" fill="#14261F" stroke="#2F6B52"/>
      <text x="732" y="62" fill="#3DDC97">MCP stdio</text>
      <rect x="854" y="42" width="110" height="30" rx="8" fill="#152238"/>
      <text x="864" y="62" fill="#E8EEF5">/metrics</text>
    </g>
  </g>

  <path d="M600 212 V236" stroke="#5B9FFF" stroke-width="2.5"/>
  <polygon points="600,244 593,232 607,232" fill="#5B9FFF"/>

  <!-- orchestrator -->
  <g transform="translate(48 250)">
    <rect width="1104" height="78" rx="16" fill="#121E30" stroke="#5B9FFF"/>
    <text x="24" y="32" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">RESPONSE ORCHESTRATOR</text>
    <text x="24" y="58" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">state machine · event journal · cancel · timeout · permission wait · workspace lock</text>
  </g>

  <path d="M260 336 V358" stroke="#8B9BB0" stroke-width="2"/>
  <path d="M600 336 V358" stroke="#8B9BB0" stroke-width="2"/>
  <path d="M940 336 V358" stroke="#8B9BB0" stroke-width="2"/>

  <!-- backends + journal -->
  <g transform="translate(48 362)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="340" height="54" rx="14" fill="#0F1620" stroke="#4A627F"/>
    <text x="170" y="24" text-anchor="middle" fill="#E8EEF5" font-size="18" font-weight="600">HeadlessBackend</text>
    <text x="170" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">grok -p --prompt-file</text>

    <rect x="382" width="340" height="54" rx="14" fill="#0F1A16" stroke="#3DDC97"/>
    <text x="552" y="24" text-anchor="middle" fill="#E8EEF5" font-size="18" font-weight="600">AcpBackend</text>
    <text x="552" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">grok agent stdio</text>

    <rect x="764" width="340" height="54" rx="14" fill="#0F1620" stroke="#4A627F"/>
    <text x="934" y="24" text-anchor="middle" fill="#E8EEF5" font-size="18" font-weight="600">SQLite Journal</text>
    <text x="934" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">WAL · events · keys</text>
  </g>
</svg>
