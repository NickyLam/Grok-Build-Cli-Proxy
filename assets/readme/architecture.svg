<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gateway architecture</title>
  <desc id="desc">API gateway, response orchestrator, dual backends, SQLite journal, and Grok Build CLI.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#243041"/>

  <text x="56" y="52" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.5">HOW IT WORKS</text>
  <text x="56" y="90" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700">One orchestrator. Two backends. Durable events.</text>

  <!-- layer 1 APIs -->
  <g transform="translate(56 120)">
    <rect width="1088" height="72" rx="16" fill="#121A24" stroke="#2A3A4F"/>
    <text x="24" y="28" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">API GATEWAY</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#E8EEF5">
      <rect x="24" y="38" width="190" height="24" rx="6" fill="#172232"/>
      <text x="34" y="55">/v1/chat/completions</text>
      <rect x="228" y="38" width="150" height="24" rx="6" fill="#172232"/>
      <text x="238" y="55">/v1/responses</text>
      <rect x="392" y="38" width="170" height="24" rx="6" fill="#172232"/>
      <text x="402" y="55">/v1/permissions</text>
      <rect x="576" y="38" width="100" height="24" rx="6" fill="#172232"/>
      <text x="586" y="55">/v1/keys</text>
      <rect x="690" y="38" width="120" height="24" rx="6" fill="#14261F" stroke="#2F6B52"/>
      <text x="700" y="55" fill="#3DDC97">MCP stdio</text>
      <rect x="824" y="38" width="100" height="24" rx="6" fill="#172232"/>
      <text x="834" y="55">/metrics</text>
    </g>
  </g>

  <!-- arrow -->
  <path d="M600 200 V222" stroke="#5B9FFF" stroke-width="2"/>
  <polygon points="600,230 594,220 606,220" fill="#5B9FFF"/>

  <!-- orchestrator -->
  <g transform="translate(56 238)">
    <rect width="1088" height="70" rx="16" fill="#152238" stroke="#5B9FFF"/>
    <text x="24" y="30" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">RESPONSE ORCHESTRATOR</text>
    <text x="24" y="54" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">state machine · event journal · cancel · timeout · permission wait · workspace lock</text>
  </g>

  <path d="M320 316 V336" stroke="#8B9BB0" stroke-width="2"/>
  <path d="M600 316 V336" stroke="#8B9BB0" stroke-width="2"/>
  <path d="M880 316 V336" stroke="#8B9BB0" stroke-width="2"/>

  <!-- bottom three -->
  <g transform="translate(56 340)">
    <rect width="320" height="56" rx="14" fill="#121A24" stroke="#4A627F"/>
    <text x="160" y="24" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">HeadlessBackend</text>
    <text x="160" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">grok -p --prompt-file</text>

    <rect x="384" width="320" height="56" rx="14" fill="#14261F" stroke="#3DDC97"/>
    <text x="544" y="24" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">AcpBackend</text>
    <text x="544" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">grok agent stdio</text>

    <rect x="768" width="320" height="56" rx="14" fill="#121A24" stroke="#4A627F"/>
    <text x="928" y="24" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">SQLite Journal</text>
    <text x="928" y="44" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">WAL · events · keys</text>
  </g>
</svg>
