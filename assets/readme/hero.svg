<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">OpenGrokBuild — Local Agent Gateway</title>
  <desc id="desc">Turn Grok Build CLI into an OpenAI-compatible local gateway: Chat Completions, Responses API, and MCP tools with permissions and workspace isolation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#111922"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9FFF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#5B9FFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#243041"/>

  <!-- left accent rail -->
  <rect x="0" y="64" width="5" height="252" rx="2.5" fill="#5B9FFF"/>

  <!-- title block -->
  <g transform="translate(48 48)">
    <text x="0" y="22" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.5">LOCAL AGENT GATEWAY · v0.2 · MIT</text>
    <text x="0" y="78" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="46" font-weight="700">OpenGrokBuild</text>
    <text x="0" y="120" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">One local process. OpenAI HTTP + MCP in,</text>
    <text x="0" y="150" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">Grok Build agent out — with cancel, SSE,</text>
    <text x="0" y="180" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">permissions, and workspace isolation.</text>

    <g transform="translate(0 220)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect x="0" y="0" width="168" height="36" rx="10" fill="#152238" stroke="#3A5470"/>
      <text x="84" y="23" text-anchor="middle" fill="#A8B8CC">Chat Completions</text>
      <rect x="178" y="0" width="128" height="36" rx="10" fill="#152238" stroke="#3A5470"/>
      <text x="242" y="23" text-anchor="middle" fill="#A8B8CC">Responses</text>
      <rect x="316" y="0" width="88" height="36" rx="10" fill="#14261F" stroke="#2F6B52"/>
      <text x="360" y="23" text-anchor="middle" fill="#3DDC97">MCP</text>
      <rect x="414" y="0" width="148" height="36" rx="10" fill="#152238" stroke="#3A5470"/>
      <text x="488" y="23" text-anchor="middle" fill="#A8B8CC">127.0.0.1 only</text>
    </g>
  </g>

  <!-- right: terminal proof of the gateway path -->
  <g transform="translate(680 40)">
    <rect x="0" y="0" width="472" height="300" rx="18" fill="#0C121A" stroke="#2A3A4F"/>
    <!-- title bar -->
    <rect x="0" y="0" width="472" height="40" rx="18" fill="#121A24"/>
    <rect x="0" y="22" width="472" height="18" fill="#121A24"/>
    <circle cx="28" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="48" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="68" cy="20" r="5" fill="#28C840"/>
    <text x="236" y="25" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">gateway · :8787</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="24" y="72" fill="#5B9FFF" font-size="16">$</text>
      <text x="44" y="72" fill="#E8EEF5" font-size="16">uv run grok-proxy</text>

      <text x="24" y="108" fill="#8B9BB0" font-size="15">Base URL  http://127.0.0.1:8787/v1</text>
      <text x="24" y="134" fill="#8B9BB0" font-size="15">API Key   sk-gp-••••  (auto)</text>
      <text x="24" y="160" fill="#8B9BB0" font-size="15">Model     grok-4.5</text>

      <path d="M24 180 H448" stroke="#243041" stroke-width="1"/>

      <text x="24" y="210" fill="#8B9BB0" font-size="14">REQUEST PATH</text>

      <!-- path chips -->
      <rect x="24" y="228" width="96" height="40" rx="10" fill="#152238" stroke="#5B9FFF"/>
      <text x="72" y="253" text-anchor="middle" fill="#E8EEF5" font-size="15" font-weight="600">Client</text>

      <path d="M128 248 H148" stroke="url(#flow)" stroke-width="3"/>
      <polygon points="148,248 140,243 140,253" fill="#5B9FFF"/>

      <rect x="152" y="228" width="120" height="40" rx="10" fill="#152238" stroke="#5B9FFF"/>
      <text x="212" y="253" text-anchor="middle" fill="#E8EEF5" font-size="15" font-weight="600">Orchestrator</text>

      <path d="M280 248 H300" stroke="url(#flow)" stroke-width="3"/>
      <polygon points="300,248 292,243 292,253" fill="#3DDC97"/>

      <rect x="304" y="228" width="140" height="40" rx="10" fill="#14261F" stroke="#3DDC97"/>
      <text x="374" y="253" text-anchor="middle" fill="#3DDC97" font-size="15" font-weight="600">Grok Build</text>
    </g>
  </g>
</svg>
