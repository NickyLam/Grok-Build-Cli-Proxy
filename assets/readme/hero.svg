<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Grok Build CLI Proxy — local Agent Gateway</title>
  <desc id="desc">OpenAI-compatible gateway that exposes Grok Build as Chat Completions, Responses API, and MCP tools with permissions and workspace isolation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121A24"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9FFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5B9FFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#E8EEF5" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#243041" stroke-width="1"/>

  <!-- left accent bar -->
  <rect x="0" y="72" width="6" height="216" rx="3" fill="#5B9FFF"/>

  <!-- title block -->
  <g transform="translate(56 52)">
    <text x="0" y="22" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">LOCAL AGENT GATEWAY · v0.2</text>
    <text x="0" y="78" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="48" font-weight="700">Grok Build CLI Proxy</text>
    <text x="0" y="122" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">Turn Grok Build into OpenAI-compatible</text>
    <text x="0" y="152" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">Chat · Responses · MCP APIs — with</text>
    <text x="0" y="182" fill="#C5D0DE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">permissions, workspaces, and cancel/SSE.</text>

    <g transform="translate(0 220)">
      <rect x="0" y="0" width="112" height="34" rx="10" fill="#172232" stroke="#33455C"/>
      <text x="56" y="22" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Python 3.11+</text>
      <rect x="124" y="0" width="100" height="34" rx="10" fill="#172232" stroke="#33455C"/>
      <text x="174" y="22" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">MIT</text>
      <rect x="236" y="0" width="150" height="34" rx="10" fill="#14261F" stroke="#2F6B52"/>
      <text x="311" y="22" text-anchor="middle" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">127.0.0.1 only</text>
    </g>
  </g>

  <!-- right: mini architecture proof -->
  <g transform="translate(700 48)">
    <rect x="0" y="0" width="448" height="264" rx="18" fill="#0E1520" stroke="#2A3A4F"/>
    <text x="24" y="34" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">REQUEST PATH</text>

    <!-- clients -->
    <rect x="24" y="56" width="118" height="52" rx="12" fill="#172232" stroke="#5B9FFF"/>
    <text x="83" y="78" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Clients</text>
    <text x="83" y="98" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">HTTP · MCP</text>

    <path d="M150 82 H188" stroke="url(#rail)" stroke-width="3" fill="none"/>
    <circle cx="188" cy="82" r="4" fill="#5B9FFF"/>

    <!-- gateway -->
    <rect x="196" y="50" width="140" height="64" rx="12" fill="#152238" stroke="#5B9FFF" stroke-width="1.5"/>
    <text x="266" y="76" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Orchestrator</text>
    <text x="266" y="98" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">state · journal</text>

    <path d="M266 122 V148" stroke="#5B9FFF" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M220 148 H312" stroke="#5B9FFF" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M220 148 V164" stroke="#5B9FFF" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M312 148 V164" stroke="#3DDC97" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- backends -->
    <rect x="150" y="164" width="120" height="48" rx="10" fill="#172232" stroke="#4A627F"/>
    <text x="210" y="185" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">Headless</text>
    <text x="210" y="203" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">grok -p file</text>

    <rect x="286" y="164" width="120" height="48" rx="10" fill="#14261F" stroke="#3DDC97"/>
    <text x="346" y="185" text-anchor="middle" fill="#E8EEF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">ACP</text>
    <text x="346" y="203" text-anchor="middle" fill="#8B9BB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">agent stdio</text>

    <path d="M266 220 V236" stroke="#8B9BB0" stroke-width="2" fill="none" opacity="0.5"/>
    <rect x="186" y="236" width="160" height="40" rx="10" fill="#1A2433" stroke="#3DDC97"/>
    <text x="266" y="261" text-anchor="middle" fill="#3DDC97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Grok Build CLI</text>
  </g>
</svg>
